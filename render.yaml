# Blueprint do Render: o serviço web (Docker). O Postgres fica fora do Render (ex.: Neon),
# porque o Postgres grátis do Render vence em 30 dias. Em render.com: New > Blueprint.
services:
  - type: web
    name: helpdesk-ti
    runtime: docker
    dockerfilePath: ./Dockerfile.deploy
    plan: free
    healthCheckPath: /api/health
    envVars:
      # URL do Postgres (no Neon: a conexão direta, sem pooling). Preencha no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Senha dos usuários de demonstração do seed (escolha no painel do Render).
      - key: DEMO_PASSWORD
        sync: false
      # Opcional: sem chave, a triagem usa o classificador por palavras-chave.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRIAGE_MODEL
        value: claude-opus-5-5
