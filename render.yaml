# Blueprint do Render: um serviço web (Docker) e um Postgres.
# Em render.com: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: helpdesk-ti
    runtime: docker
    dockerfilePath: ./Dockerfile.deploy
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-ti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Senha dos usuários de demonstração do seed (escolha no painel do Render).
      - key: DEMO_PASSWORD
        sync: false
      # Opcional: sem chave, a triagem usa o classificador por palavras-chave.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRIAGE_MODEL
        value: claude-opus-5-5

databases:
  - name: helpdesk-ti-db
    plan: free
    databaseName: helpdesk
